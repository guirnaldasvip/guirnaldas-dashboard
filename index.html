<script>
(function(){
  var SUPABASE_URL = "https://vmppylxetjgzysfvwfih.supabase.co";
  var SUPABASE_KEY = "sb_publishable_nojOFLvTOaJkna_8N41T1w_AoZKFyQq";

  var ownerParam = new URLSearchParams(window.location.search).get('gv_owner');
  if (ownerParam === '1') { localStorage.setItem('gv_owner_flag', 'true'); }
  if (ownerParam === '0') { localStorage.removeItem('gv_owner_flag'); }
  if (localStorage.getItem('gv_owner_flag') === 'true') { return; }

  function detectSource(){
    var params = new URLSearchParams(window.location.search);
    var utmSource = params.get('utm_source');
    if (utmSource) {
      var u = utmSource.toLowerCase();
      if (u.indexOf('google') > -1) return 'Google Ads';
      if (u.indexOf('facebook') > -1 || u.indexOf('fb') > -1) return 'Facebook Ads';
      if (u.indexOf('instagram') > -1 || u.indexOf('ig') > -1) return 'Instagram Ads';
      if (u.indexOf('whatsapp') > -1) return 'WhatsApp';
      return utmSource.charAt(0).toUpperCase() + utmSource.slice(1);
    }

    var ref = document.referrer;
    if (!ref) return 'Directo / Organico';

    var host = '';
    try { host = new URL(ref).hostname.toLowerCase(); } catch(e) { return 'Directo / Organico'; }

    if (host.indexOf('google.') > -1) return 'Google';
    if (host.indexOf('instagram.com') > -1) return 'Instagram';
    if (host.indexOf('facebook.com') > -1 || host.indexOf('fb.com') > -1) return 'Facebook';
    if (host.indexOf('whatsapp.com') > -1 || host.indexOf('wa.me') > -1) return 'WhatsApp';
    if (host.indexOf('chatgpt.com') > -1 || host.indexOf('chat.openai.com') > -1) return 'ChatGPT';
    if (host.indexOf('claude.ai') > -1) return 'Claude';
    if (host.indexOf('perplexity.ai') > -1) return 'Perplexity';
    if (host.indexOf('bing.com') > -1) return 'Bing';
    if (host.indexOf('tiktok.com') > -1) return 'TikTok';
    if (host.indexOf('twitter.com') > -1 || host.indexOf('x.com') > -1) return 'Twitter / X';
    if (host.indexOf('mercadolibre.com') > -1 || host.indexOf('mercadolivre.com') > -1) return 'Mercado Libre';
    if (host.indexOf(window.location.hostname) > -1) return 'Directo / Organico';

    return host;
  }

  var sessionId = sessionStorage.getItem('gv_session_id');
  var source = sessionStorage.getItem('gv_source');
  if (!sessionId) {
    sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem('gv_session_id', sessionId);
    source = detectSource();
    sessionStorage.setItem('gv_source', source);
  }
  if (!source) { source = 'Directo / Organico'; }

  function getPageInfo(){
    var name = document.title || "Pagina";
    var body = (document.body && document.body.className) || "";
    if (body.indexOf('template-index') > -1) {
      name = "Inicio";
    } else if (body.indexOf('template-product') > -1) {
      var h1 = document.querySelector('h1');
      name = h1 ? h1.textContent.replace(/^\s+|\s+$/g, '') : name;
    } else if (body.indexOf('template-category') > -1) {
      var h1c = document.querySelector('h1');
      name = h1c ? ("Categoria " + h1c.textContent.replace(/^\s+|\s+$/g, '')) : name;
    } else if (body.indexOf('template-cart') > -1) {
      name = "Carrito";
    } else if (body.indexOf('template-checkout') > -1) {
      name = "Checkout";
    }
    return { name: name, url: window.location.href };
  }

  function withLocation(cb){
    var cached = sessionStorage.getItem('gv_geo');
    if (cached) { cb(JSON.parse(cached)); return; }
    fetch('https://ipapi.co/json/')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var geo = {
          city: d.city || "Desconocida",
          country_code: d.country_code || ""
        };
        sessionStorage.setItem('gv_geo', JSON.stringify(geo));
        cb(geo);
      })
      .catch(function(){ cb({ city: "Desconocida", country_code: "" }); });
  }

  function sendHeartbeat(){
    var page = getPageInfo();
    withLocation(function(geo){
      var body = {
        session_id: sessionId,
        city: geo.city,
        country_code: geo.country_code,
        current_page: page.name,
        current_url: page.url,
        source: source,
        last_seen_at: new Date().toISOString()
      };
      fetch(SUPABASE_URL + "/rest/v1/live_sessions?on_conflict=session_id", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "resolution=merge-duplicates"
        },
        body: JSON.stringify(body)
      }).catch(function(){});
    });
  }

  var lastPage = null;
  function trackPageChange(){
    var page = getPageInfo();
    if (page.name === lastPage) return;
    lastPage = page.name;

    fetch(SUPABASE_URL + "/rest/v1/page_views", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify({ session_id: sessionId, page_name: page.name, page_url: page.url })
    }).catch(function(){});

    fetch(SUPABASE_URL + "/rest/v1/event_log", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify({ event_type: "visit", detail: page.name })
    }).catch(function(){});
  }

  function start(){
    trackPageChange();
    sendHeartbeat();
    setInterval(function(){
      trackPageChange();
      sendHeartbeat();
    }, 15000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  window.addEventListener('beforeunload', function(){
    if (navigator.sendBeacon) {
      navigator.sendBeacon(
        SUPABASE_URL + "/rest/v1/live_sessions?session_id=eq." + sessionId,
        new Blob([JSON.stringify({ last_seen_at: new Date(0).toISOString() })], { type: 'application/json' })
      );
    }
  });
})();
</script>
